<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balaji Enterprises HRMS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:#172d37;font:16px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button:disabled{cursor:default;opacity:.5}a{color:inherit}header{background:#132e37;color:white;padding:20px clamp(18px,5vw,68px);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}header strong{font-size:21px}nav{display:flex;gap:8px;flex-wrap:wrap}button,.button{border:1px solid #b9c9cc;border-radius:9px;padding:9px 15px;background:white;color:#17323d;text-decoration:none}nav button{background:transparent;color:white;border-color:transparent}nav button[aria-current=true]{background:#30505b}main{max-width:1240px;margin:auto;padding:38px 20px}h1{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:0 0 8px}h2{font-size:21px;margin:0 0 18px}.muted{color:#526a74}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.primary{background:#136854;border-color:#136854;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin:26px 0}.card,section,fieldset{background:white;border:1px solid #d9e3e7;border-radius:14px;padding:22px}.card{border-top:4px solid #36a68e}.card strong{display:block;font-size:34px;line-height:1.2;margin-bottom:6px}.table{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #e3eaed;white-space:nowrap}th{font-size:14px;color:#526a74}td button{padding:0;border:0;color:#136854;text-decoration:underline}input,select,textarea{border:1px solid #b9c9cc;border-radius:8px;padding:9px 11px;background:white;color:#172d37;min-width:0;max-width:100%}fieldset{margin:18px 0;min-width:0}legend{font-size:18px;font-weight:650;padding:0 8px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:grid;gap:6px}label input[type=checkbox]{justify-self:start}.error{color:#992c2c}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #37a990;outline-offset:2px}

:root{color-scheme:dark}body{background:radial-gradient(ellipse at top,#202b41 0,#0c111d 58%);color:#eef3fb;min-height:100vh}header{background:#0e1625;border-bottom:1px solid #2a3950}main{max-width:1360px}.muted,th{color:#a9b9d0}button,.button,input,select,textarea{background:#172338;color:#edf4ff;border-color:#42516a}nav button[aria-current=true]{background:#273954}.primary{background:#74e7c0;color:#102421;border-color:#74e7c0;font-weight:650}.card,section,fieldset{background:linear-gradient(145deg,#1b283d,#141e2e);border-color:#35455e}.card{border-top-color:#74e7c0}.card strong{color:#a0f8de}td,th{border-color:#324259}td button{background:transparent;color:#83efd0}.error{color:#ffb1aa}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.tool{text-align:left;padding:20px;min-height:108px;border-radius:14px}.tool strong{display:block;color:#a0f8de;font-size:18px;margin-bottom:6px}.tool span{color:#becbe0}.tool:hover{background:#253753}.doc-preview{display:block;max-width:min(100%,360px);max-height:250px;object-fit:contain;margin:10px 0;border-radius:8px}.holiday-row{margin:12px 0;align-items:end}
</style>
<header><strong>Balaji Enterprises HRMS</strong><nav aria-label="Main navigation"><button data-view="overview">Overview</button><button data-view="employees">Employees</button><button data-view="reports" hidden>Expiry reports</button></nav></header>
<main><p id="notice" role="status"></p><div id="screen"></div></main>
<script>
"use strict";
const csrf = {{ csrf_token | tojson }};
const screen = document.querySelector("#screen");
const notice = document.querySelector("#notice");
const escape = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const e = escape;
let access, viewId = 0;
async function api(method, args = {}, write = false) {
  const query = new URLSearchParams(Object.entries(args).filter(([,value])=>value!=null));
  const response = await fetch("/api/method/balaji_hr.people." + method + (write ? "" : "?" + query), {
    method: write ? "POST" : "GET", headers: write ? {"Content-Type":"application/json","X-Frappe-CSRF-Token":csrf} : {},
    body: write ? JSON.stringify(args) : undefined, cache:"no-store"
  });
  if (response.status === 401) throw Error("Your session expired. Sign in again.");
  if (!response.ok) throw Error("Request failed. Check your permissions and the required values, then try again.");
  return (await response.json()).message;
}
const table = (headers, rows) => rows.length ? '<div class="table"><table><thead><tr>' + headers.map(h=>'<th scope="col">'+e(h)+'</th>').join('') + '</tr></thead><tbody>' + rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>' : '<p class="muted">No records found.</p>';
function showError(error){notice.className="error";notice.textContent=error.message;}
function view(name, employee) {
  const id = ++viewId;
  notice.textContent="";
  screen.innerHTML="<p>Loading…</p>";
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===name)));
  const render = html => {if(id===viewId) screen.innerHTML=html; return id===viewId;};
  ({overview,employees,reports,profile,operation}[name])(render, employee).catch(error=>{if(id===viewId){render("");showError(error);}});
}
function addButton(){return access?.can_create ? '<button class="primary" data-view="profile">Add employee</button>' : '';}
async function overview(render){
  access=await api("overview");
  document.querySelector('[data-view=reports]').hidden=!access.can_expiry;
  render('<h1>People overview</h1><p class="muted">Staffing, attendance and leave at a glance.</p><div class="bar">'+addButton()+'<button data-view="employees">View employees</button></div><div class="cards">'+access.cards.map(c=>'<article class="card"><strong>'+e(c.value)+'</strong>'+e(c.label)+'</article>').join('')+'</div><h2>HR operations</h2><div class="tools">'+(access.operations||[]).map(dt=>'<button class="tool" data-view="operation" data-employee="'+e(dt)+'"><strong>'+e(operationLabels[dt])+'</strong><span>'+e(operationDescriptions[dt])+'</span></button>').join('')+'</div>'+(access.can_expiry?'<section><h2>Upcoming document expiries</h2><p>Review permits, passports and visas due in the next 30 days.</p><button data-view="reports">Open expiry reports</button></section>':''));
}
function pagination(offset, count){return '<div class="bar"><button data-step="-25" '+(offset?'':'disabled')+'>Previous</button><button data-step="25" '+(count>25?'':'disabled')+'>Next</button></div>';}
async function employees(render){
  if(!render('<h1>Employees</h1><p class="muted">Search and open employee profiles.</p><form class="bar"><input name="search" aria-label="Employee name" placeholder="Search employee name"><select name="category" aria-label="Category"><option value="">All categories</option><option>Local</option><option>Foreign</option><option>Other</option></select><button>Search</button>'+addButton()+'</form><section class="results"></section>'))return;
  await results("employees", r=>['Employee','ID','Department','Designation','Category','Status'], r=>[profileButton(r.name,r.employee_name),...["name","department","designation","custom_balaji_category","status"].map(k=>e(r[k]))]);
}
async function reports(render){
  if(!render('<h1>Expiry reports</h1><p class="muted">Review upcoming expiry dates by document type.</p><form class="bar"><select name="kind" aria-label="Document type"><option value="permit_expiry_date">Work permits</option><option value="passport_expiry_date">Passports</option><option value="visa_expiry_date">Visas</option></select><select name="days" aria-label="Time window"><option>30</option><option>60</option><option>90</option></select><button>Run report</button></form><section class="results"></section>'))return;
  await results("expiry",()=>["Employee","ID","Expires"],r=>[profileButton(r.employee,r.name),e(r.employee),e(r.expiry)]);
}
function profileButton(id,name){return '<button data-view="profile" data-employee="'+e(id)+'">'+e(name)+'</button>';}
async function results(method,headers,map){
  const form=screen.querySelector("form"), result=screen.querySelector(".results");
  let offset=0, request=0;
  async function load(){
    const seq=++request;
    result.textContent="Loading…";
    try{
      const payload=await api(method,{...Object.fromEntries(new FormData(form)),offset});
      const rows=Array.isArray(payload)?payload:payload.rows;
      const count=Array.isArray(payload)?rows.length:payload.has_more?26:rows.length;
      if(seq===request&&result.isConnected)result.innerHTML=table(headers(rows),rows.slice(0,25).map(map))+pagination(offset,count);
    }catch(error){if(seq===request&&result.isConnected){result.textContent="";showError(error);}}
  }
  form.addEventListener("submit",event=>{event.preventDefault();offset=0;load();});
  result.addEventListener("click",event=>{const b=event.target.closest("[data-step]");if(b){offset+=Number(b.dataset.step);load();}});
  await load();
}
async function profile(render,employee){
  const p=await api("profile",employee?{employee}:{});
  const groups=[["Employee details",p.schema.filter(f=>!f.private&&!f.name.startsWith("custom_balaji_leave")&&f.name!=="custom_balaji_auto_leave")],["Leave setup",p.schema.filter(f=>f.name.startsWith("custom_balaji_leave")||f.name==="custom_balaji_auto_leave")],["Confidential details",p.schema.filter(f=>f.private)]];
  const select=(opts,val)=>['',...new Set([...(opts||[]),...(val?[val]:[])])].map(o=>'<option '+(o===val?'selected':'')+'>'+e(o)+'</option>').join('');
  function field(f){
    const val=(f.private?p.private:p.values)[f.name]??"";
    const disabled=!p.can_write||(f.private&&!p.can_private)||(f.name==="custom_balaji_category"&&!p.categories.length);
    const attrs=' name="'+e(f.name)+'" '+(f.required?'required ':'')+(disabled?'disabled ':'');
    let control;
    if(f.type==="Select")control='<select'+attrs+'>'+select(f.name==="custom_balaji_category"?p.categories:(f.options||"").split("\n").filter(Boolean),val)+'</select>';
    else if(f.type==="Link")control='<input'+attrs+' value="'+e(val)+'" list="link-'+e(f.name)+'" data-link="'+e(f.options)+'" autocomplete="off"><datalist id="link-'+e(f.name)+'"></datalist>';
    else if(f.type==="Check")control='<input type="checkbox"'+attrs+(Number(val)?' checked':'')+'>';
    else control='<input type="'+(f.type==="Date"?"date":f.type==="Currency"?"number":"text")+'"'+attrs+' value="'+e(val)+'"'+(f.type==="Currency"?' step="0.01"':'')+'>';
    return '<label>'+e(f.label)+control+'</label>';
  }
  if(!render('<h1>'+e(employee?p.values.first_name||employee:"Add employee")+'</h1><button data-view="employees">Back to employees</button><form>'+groups.filter(g=>g[1].length).map(([label,fields])=>'<fieldset><legend>'+e(label)+'</legend><div class="fields">'+fields.map(field).join('')+'</div></fieldset>').join('')+(p.can_write?'<button class="primary">Save employee</button>':'')+'</form>'))return;
  const form=screen.querySelector("form");
  if(employee&&(p.can_private||Object.values(p.attachments).some(Boolean))){
    const files=document.createElement("section");
    files.innerHTML='<h2>Confidential documents</h2>'+Object.entries({passport_copy:"Passport copy",permit_copy:"Permit copy",visa_copy:"Visa copy"}).map(([key,label])=>{
      const url=p.attachments[key];
      if(url?.startsWith("/private/files/"))return '<p><a href="'+e(url)+'" target="_blank" rel="noopener">'+e(label)+(/\.(png|jpe?g)(?:$|\?)/i.test(url)?'<img class="doc-preview" src="'+e(url)+'" alt="'+e(label)+'" loading="lazy">':'')+'</a></p>';
      return p.can_private?'<form class="bar" data-upload="'+key+'"><label>'+e(label)+'<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required></label><button>Attach privately</button></form>':'';
    }).join('');
    form.after(files);
    files.addEventListener("submit",async event=>{
      event.preventDefault();
      const upload=event.target, button=upload.querySelector("button");
      const data=new FormData(upload);data.set("employee",employee);data.set("field",upload.dataset.upload);
      button.disabled=true;
      try{
        const response=await fetch("/api/method/balaji_hr.people.upload",{method:"POST",headers:{"X-Frappe-CSRF-Token":csrf},body:data});
        if(!response.ok)throw Error("Attachment failed. Check file format, size and access.");
        if(upload.isConnected)view("profile",employee);
      }catch(error){if(upload.isConnected){showError(error);button.disabled=false;}}
    });
  }
  form.querySelectorAll("[data-link]").forEach(input=>{
    let timer,seq=0;
    const search=()=>{const current=++seq;clearTimeout(timer);timer=setTimeout(async()=>{try{const options=await api("link_options",{doctype:input.dataset.link,search:input.value});if(current===seq&&input.isConnected)input.list.innerHTML=options.map(x=>'<option value="'+e(x)+'"></option>').join('');}catch(error){if(input.isConnected)showError(error);}},180);};
    input.addEventListener("input",search);input.addEventListener("focus",search);
  });
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    if(!p.can_write)return;
    const submit=form.querySelector(".primary");submit.disabled=true;
    const values={},confidential={};
    for(const f of p.schema){
      const input=form.elements.namedItem(f.name);
      if(!input||input.disabled)continue;
      const target=f.private?confidential:values;
      const value=input.type==="checkbox"?Number(input.checked):input.value;
      if(f.private&&!employee&&value==="")continue;
      if(f.private&&value===(p.private[f.name]??""))continue;
      target[f.name]=value;
    }
    try{const id=await api("save",{employee,values,confidential},true);view("profile",id);notice.className="";notice.textContent="Employee saved.";}
    catch(error){showError(error);submit.disabled=false;}
  });
}
document.addEventListener("click",event=>{const b=event.target.closest("[data-view]");if(b){event.preventDefault();view(b.dataset.view,b.dataset.employee);}});
const operationLabels = {
  Attendance: "Attendance",
  "Employee Checkin": "Check-in / Check-out",
  "Shift Assignment": "Shift assignments",
  "Holiday List": "Holiday lists",
  "Leave Policy Assignment": "Leave assignments"
};
const operationDescriptions = {
  Attendance: "Review daily presence and record attendance.",
  "Employee Checkin": "Review punch logs and record IN or OUT events.",
  "Shift Assignment": "Assign a shift and effective dates.",
  "Holiday List": "Set holiday calendars and dates.",
  "Leave Policy Assignment": "Assign a leave policy and effective period."
};
async function operation(render, dt, record, editing=false){
  const title=operationLabels[dt];
  if(!title)throw Error("Unsupported operation.");
  if(!render('<h1>'+e(title)+'</h1><p class="muted">'+e(operationDescriptions[dt])+'</p><div class="bar"><button data-view="overview">Dashboard</button>' +(access?.operation_create?.includes(dt)?'<button id="new-operation" class="primary">New record</button>':'')+ '</div><section class="results"></section>'))return;
  const add=screen.querySelector("#new-operation");
  if(add)add.onclick=()=>openOperation(dt,null);
  const panel=screen.querySelector(".results");
  let offset=0, request=0;
  async function load(){
    const seq=++request;
    panel.textContent="Loading…";
    try{
      const rows=await api("operation_list",{doctype:dt,offset});
      if(!panel.isConnected||seq!==request)return;
      const columns=Object.keys(rows[0]||{}).filter(key=>!["name","docstatus"].includes(key)).slice(0,6);
      panel.innerHTML=table(["Record","State",...columns.map(k=>k.replaceAll("_"," "))],rows.slice(0,25).map(row=>[
        '<button data-operation-record="'+e(row.name)+'">'+e(row.name)+'</button>',
        e(dt==="Employee Checkin"||dt==="Holiday List"?"Saved":({0:"Draft",1:"Submitted",2:"Cancelled"}[row.docstatus]||"Saved")),
        ...columns.map(k=>e(row[k]))
      ]))+pagination(offset,rows.length);
    }catch(error){if(panel.isConnected&&seq===request){panel.textContent="";showError(error);}}
  }
  panel.onclick=event=>{
    const record=event.target.closest("[data-operation-record]");
    if(record)openOperation(dt,record.dataset.operationRecord);
    const step=event.target.closest("[data-step]");
    if(step){offset+=Number(step.dataset.step);load();}
  };
  if(editing)await operationForm(panel,dt,record);
  else await load();
}
function openOperation(dt,record){
  const id=++viewId;
  notice.textContent="";
  const render=html=>{if(id!==viewId)return false;screen.innerHTML=html;return true;};
  operation(render,dt,record,true).catch(error=>{if(id===viewId)showError(error);});
}
async function operationForm(panel,dt,record){
  panel.textContent="Loading form…";
  const data=await api("operation_form",{doctype:dt,name:record});
  if(!panel.isConnected)return;
  let next=0;
  function control(f,val,index=""){
    const name=e(f.name+index), value=String(val??"");
    const attrs=' name="'+name+'" '+(f.required?'required ':'')+(data.can_write?'':'disabled ');
    let input;
    if(f.type==="Select"){
      input='<select'+attrs+'>'+[...new Set(["",...(f.options||"").split("\n"),value])].map(x=>'<option'+(x===value?' selected':'')+'>'+e(x)+'</option>').join("")+'</select>';
    }else if(f.type==="Check"){
      input='<input type="checkbox"'+attrs+(Number(val)?' checked':'')+'>';
    }else if(f.type==="Link"){
      input='<input'+attrs+' value="'+e(value)+'" data-link="'+e(f.options)+'" list="choices-'+name+'" autocomplete="off"><datalist id="choices-'+name+'"></datalist>';
    }else{
      const type={Date:"date",Datetime:"datetime-local",Time:"time"}[f.type]||"text";
      input='<input type="'+type+'"'+attrs+' value="'+e(type==="datetime-local"?value.replace(" ","T").slice(0,19):value)+'"'+(type==="datetime-local"?' step="1"':'')+'>';
    }
    return '<label>'+e(f.label)+input+'</label>';
  }
  const holiday=(row={})=>{
    const suffix="_"+(++next);
    return '<div class="fields holiday-row" data-suffix="'+suffix+'">'+data.child_schema.map(f=>control(f,row[f.name],suffix)).join("")+(data.can_write?'<button type="button" data-remove>Remove date</button>':'')+'</div>';
  };
  panel.innerHTML='<div class="bar"><button type="button" id="operation-back">Back to records</button></div><h2>'+e(record||"New record")+'</h2><form><div class="fields">'+data.schema.map(f=>control(f,data.values[f.name])).join("")+'</div>'+
    (data.child_schema.length?'<fieldset><legend>Holiday dates</legend><div id="holiday-rows">'+data.holidays.map(holiday).join("")+'</div>'+(data.can_write?'<button type="button" data-add-date>Add date</button>':'')+'</fieldset>':'')+
    (data.can_write?'<div class="bar"><button class="primary" value="save">Save</button>'+(data.can_submit?'<button value="submit">Submit record</button>':'')+'</div>':'')+'</form>';
  panel.querySelector("#operation-back").onclick=()=>view("operation",dt);
  const form=panel.querySelector("form");
  form.onclick=event=>{
    if(event.target.closest("[data-add-date]"))form.querySelector("#holiday-rows").insertAdjacentHTML("beforeend",holiday());
    if(event.target.closest("[data-remove]"))event.target.closest(".holiday-row").remove();
  };
  let timer, linkRequest=0;
  function suggest(event){
    const input=event.target.closest("[data-link]");
    if(!input)return;
    const seq=++linkRequest;
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      try{
        const options=await api("link_options",{doctype:input.dataset.link,search:input.value});
        if(input.isConnected&&seq===linkRequest)input.list.innerHTML=options.map(v=>'<option value="'+e(v)+'"></option>').join("");
      }catch(error){if(input.isConnected&&seq===linkRequest)showError(error);}
    },200);
  }
  form.addEventListener("input",suggest);
  form.addEventListener("focusin",suggest);
  function values(schema,suffix=""){
    return Object.fromEntries(schema.map(f=>{
      const input=form.elements.namedItem(f.name+suffix);
      let value=input.type==="checkbox"?Number(input.checked):input.value;
      if(input.type==="datetime-local"&&value)value=value.replace("T"," ");
      return [f.name,value];
    }));
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!data.can_write)return;
    const button=event.submitter;
    const submit=button?.value==="submit";
    if(submit&&!window.confirm("Submit this record?"))return;
    const payload={doctype:dt,name:record,values:values(data.schema),submit:Number(submit)};
    if(data.child_schema.length)payload.holidays=Array.from(form.querySelectorAll(".holiday-row"),row=>values(data.child_schema,row.dataset.suffix));
    form.querySelectorAll('button:not([type]),button[type="submit"]').forEach(b=>b.disabled=true);
    try{
      const saved=await api("operation_save",payload,true);
      if(form.isConnected)openOperation(dt,saved);
    }catch(error){
      if(form.isConnected){showError(error);form.querySelectorAll('button:not([type]),button[type="submit"]').forEach(b=>b.disabled=false);}
    }
  };
}

view("overview");
</script>
</html>
