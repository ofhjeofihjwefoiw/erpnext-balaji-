<!doctype html>

<title>Balaji Enterprise HR</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--surface:#fff;--ink:#14213d;--muted:#64748b;--line:#e5e9f2;--primary:#3347d6;--primary-d:#2636b0;--primary-l:#eef1ff;--ok:#0f9d6b;--ok-l:#e3f6ee;--warn:#c47a0a;--warn-l:#fdf1dc;--bad:#d1384f;--bad-l:#fde8ec;--side:#0e1a38;--side-w:232px;--r:12px;--shadow:0 1px 2px #0f1f4a0d,0 4px 18px #0f1f4a0a;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0;line-height:1.25}h2{font-size:15px;font-weight:650;margin:0 0 14px}p{margin:0}.muted{color:var(--muted)}small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--primary)}
button,.button{border:1px solid #d3d9e6;background:#fff;border-radius:9px;padding:0 15px;min-height:38px;font-weight:550;font-size:13.5px;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none;color:var(--ink)}
button:hover:not(:disabled){border-color:#aab4cf;background:#f8f9fd}
.primary{background:var(--primary);border-color:var(--primary);color:#fff}.primary:hover:not(:disabled){background:var(--primary-d);border-color:var(--primary-d)}
.ghost{border-color:transparent;background:transparent;color:var(--muted)}
input,select,textarea{border:1px solid #d3d9e6;border-radius:9px;padding:0 12px;min-height:40px;background:#fff;min-width:0;max-width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px #3347d61f}
button:focus-visible{outline:3px solid #3347d640;outline-offset:2px}
input[type=checkbox]{min-height:0;width:17px;height:17px;accent-color:var(--primary)}
label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:#3b4a67}label input,label select{font-weight:400;color:var(--ink)}
/* shell */
.workspace-side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);color:#c6d0ea;padding:20px 14px;overflow:auto;z-index:5}
.workspace-brand{display:flex;gap:11px;align-items:center;padding:4px 8px 22px;border-bottom:1px solid #ffffff1a;margin-bottom:6px}
.workspace-brand>span{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5d73ff,#3347d6);display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.5px;flex:none}
.workspace-brand strong{color:#fff;font-size:14.5px;line-height:1.25}.workspace-brand small{display:block;font-weight:400;color:#8f9cc2;font-size:11.5px;margin-top:2px}
.workspace-side nav p{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6c7aa5;margin:20px 10px 6px}
.workspace-side nav button,.workspace-side nav a{display:flex;width:100%;justify-content:flex-start;gap:11px;border:0;background:transparent;color:#c6d0ea;border-radius:9px;padding:0 11px;min-height:38px;font-weight:500;text-decoration:none;align-items:center}
.workspace-side nav button:hover,.workspace-side nav a:hover{background:#ffffff12;color:#fff;border:0}
.workspace-side nav button[aria-current=true]{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 #7d8fff}
.workspace-side nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.workspace-side [hidden]{display:none!important}
.workspace-top{margin-left:var(--side-w);background:#ffffffd9;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 32px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:4;color:var(--muted);font-size:13px}
#workspace-user{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:9px}
body>main{margin-left:var(--side-w);padding:28px 32px 70px;max-width:1500px}
#overview-back{display:none!important}
#notice:empty{display:none}#notice{padding:11px 15px;border-radius:9px;background:var(--ok-l);color:#0b6b49;margin-bottom:16px;font-weight:550}#notice.error{background:var(--bad-l);color:#a42338}
/* blocks */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}.hero p{margin-top:5px;color:var(--muted)}
.card,section,fieldset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
section,fieldset{padding:20px;min-width:0}section+section{margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:0 0 20px}
.card{padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.card span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.card strong{font-size:27px;letter-spacing:-.6px;line-height:1.2;overflow-wrap:anywhere}
.card.ok::before{background:var(--ok)}.card.warn::before{background:var(--warn)}.card.bad::before{background:var(--bad)}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.dashboard-grid section{padding:0}.dashboard-grid h2{padding:15px 18px;margin:0;border-bottom:1px solid var(--line)}
.feed{list-style:none;margin:0;padding:4px 18px}.feed li{padding:11px 0;border-bottom:1px solid var(--line)}.feed li:last-child{border:0}.feed small{display:block;color:var(--muted)}.feed button{border:0;padding:0;min-height:0;background:none;color:var(--primary);font-weight:600}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tool{display:grid;gap:5px;align-content:start;text-align:left;padding:18px;min-height:96px;border-radius:var(--r);background:#fff;border:1px solid var(--line);justify-content:stretch;box-shadow:var(--shadow)}
.tool strong{color:var(--primary)}.tool span{color:var(--muted);font-weight:400;font-size:13px}.tool:hover:not(:disabled){border-color:var(--primary);background:var(--primary-l)}
.bar{display:flex;gap:10px 12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px}.bar:last-child{margin-bottom:0}
.bar input,.bar select{min-width:150px}.spacer{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow:auto}
.tabs button{border:0;border-radius:0;background:none;color:var(--muted);min-height:42px;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 16px}
.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}.tabs button:hover:not(:disabled){background:none;color:var(--ink)}
.badge{display:inline-block;border-radius:30px;background:var(--ok-l);color:#0b6b49;padding:2px 10px;font-size:12px;font-weight:600}
.badge.warn{background:var(--warn-l);color:#8a5506}.badge.bad{background:var(--bad-l);color:#a42338}.badge.info{background:var(--primary-l);color:var(--primary-d)}.badge.gray{background:#eceff5;color:#4d5a74}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);font-weight:700;font-size:12px;flex:none}
.employee-cell{display:flex;gap:11px;align-items:center}.employee-cell small{display:block;color:var(--muted)}.employee-cell button{border:0;padding:0;min-height:0;background:none;color:var(--ink);font-weight:650;text-align:left}.employee-cell button:hover{color:var(--primary);background:none}

.table{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:10px}.table table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}tr:last-child td{border-bottom:0}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8f9fd;font-weight:650;position:sticky;top:0}
tbody tr:hover td{background:#fafbff}td button,td a{border:0;min-height:0;padding:0;background:none;color:var(--primary);font-weight:600;text-decoration:none}td button:hover:not(:disabled){background:none;text-decoration:underline}
.num{text-align:right!important;font-variant-numeric:tabular-nums}tfoot td{font-weight:700;background:#f8f9fd}
.calendar td:not(:first-child),.calendar th:not(:first-child){text-align:center;padding:9px 7px}
.calendar th:first-child,.calendar td:first-child,.roster th:first-child,.roster td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:170px;white-space:normal;box-shadow:1px 0 var(--line)}
.calendar th:first-child,.roster th:first-child{background:#f8f9fd}
.calendar .dot{font-size:17px}.calendar [data-status=Present]{color:var(--ok)}.calendar [data-status=Absent]{color:var(--bad)}.calendar [data-status="Half Day"]{color:var(--warn)}.calendar [data-status="On Leave"]{color:#2b78b8}.calendar [data-status="Work From Home"]{color:#7b4fd0}.calendar [data-status="Not marked"]{color:#b8c0d2}

/* forms */
fieldset{margin:0 0 16px}legend{font-weight:700;font-size:14px;padding:0 8px;margin-left:-8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;align-items:end}
.holiday-row{margin:10px 0}.doc-preview{display:block;max-width:min(100%,360px);max-height:250px;object-fit:contain;margin:10px 0;border-radius:8px}
details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:12px;background:#fbfcff}summary{cursor:pointer;font-weight:650}details[open] summary{margin-bottom:14px}
.employee-documents{margin:0 0 16px}kbd{font-size:.8em;color:var(--muted)}
/* attendance sheet */
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:30px;padding:5px 13px;font-size:12.5px;font-weight:650;background:#eceff5;color:#4d5a74}.chip.p{background:var(--ok-l);color:#0b6b49}.chip.a{background:var(--bad-l);color:#a42338}.chip.h{background:var(--warn-l);color:#8a5506}.chip.w{background:#efe8fc;color:#5d37ac}
.seg{display:inline-flex;border:1px solid #d3d9e6;border-radius:9px;overflow:hidden;background:#fff}.seg button{border:0;border-radius:0;min-height:34px;padding:0 13px;border-right:1px solid #d3d9e6;font-size:13px;color:#53607c}.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-s=Present]{background:var(--ok);color:#fff}.seg button[aria-pressed=true][data-s=Absent]{background:var(--bad);color:#fff}.seg button[aria-pressed=true][data-s="Half Day"]{background:var(--warn);color:#fff}.seg button[aria-pressed=true][data-s="Work From Home"]{background:#7b4fd0;color:#fff}
.savebar{position:sticky;bottom:14px;margin-top:16px;background:#14213d;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 10px 30px #0f1f4a40;z-index:3}.savebar .primary{background:#6277ff;border-color:#6277ff}
/* match the following */
.match{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);position:relative;min-height:320px}
.match-col{display:flex;flex-direction:column;min-width:0}.match-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.match-list{display:flex;flex-direction:column;gap:9px;max-height:520px;overflow:auto;padding:3px 5px 3px 3px}
.m-item{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;cursor:pointer;user-select:none;transition:.12s;justify-content:flex-start;text-align:left;min-height:56px;font-weight:400}
.m-item:hover{border-color:#aab4cf}.m-item.sel{border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 3px #3347d61a}
.m-item.drop{border-color:var(--primary);background:var(--primary-l);transform:scale(1.015)}.m-item b{display:block;font-weight:650}.m-item small{color:var(--muted);display:block}
.m-tag{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;color:#fff;display:inline-flex;gap:5px;align-items:center}.m-tag i{font-style:normal;cursor:pointer;opacity:.85}
.shift-item{border-left-width:6px}.m-count{margin-left:auto;font-weight:700;color:var(--muted)}
.match-lane{position:relative}.match-lane svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.help{background:var(--primary-l);color:#2b3aa8;border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}

dialog{border:0;border-radius:14px;width:min(900px,96vw);max-height:94vh;padding:0;background:#e9edf5;box-shadow:0 30px 80px #0f1f4a55}dialog::backdrop{background:#0e1a3899}
.dialog-bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;margin:0}
.dialog-body{padding:22px;overflow:auto;max-height:calc(94vh - 66px)}
.print-sheet{background:#fff;color:#111;width:100%;max-width:794px;min-height:1000px;margin:0 auto;padding:56px 64px;font:14.5px/1.75 'Source Serif 4',Georgia,'Times New Roman',serif;box-shadow:0 3px 20px #0f1f4a22;text-align:justify}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:3px double #1b2b5e;padding-bottom:14px;margin-bottom:26px;text-align:left}
.lh h1{font:700 22px/1.2 'Inter',Arial,sans-serif;letter-spacing:.3px;color:#1b2b5e;text-transform:uppercase}.lh p{font:12px/1.5 'Inter',Arial,sans-serif;color:#444}.lh .lh-r{text-align:right}

.letter-title{text-align:center;font:700 15.5px/1.3 'Inter',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 20px;text-decoration:underline;text-underline-offset:5px}
.print-sheet p{margin:0 0 13px}.print-sheet .clause{display:grid;grid-template-columns:30px 1fr;margin:0 0 9px}.print-sheet .to{text-align:left;line-height:1.55;margin-bottom:18px}

.terms{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:14px;font-family:'Inter',Arial,sans-serif}.terms td{padding:7px 12px;border:1px solid #9aa3b8;white-space:normal}.terms td:first-child{width:38%;background:#f3f5fa;font-weight:600}
.signatures{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:62px;text-align:left}.signature{border-top:1.5px solid #222;padding-top:7px;font:13px/1.5 'Inter',Arial,sans-serif}
.sig-note{font:italic 12px 'Inter',Arial,sans-serif;color:#555;margin-top:34px;text-align:center}
.slip{font:13px/1.5 'Inter',Arial,sans-serif;text-align:left;padding:40px 44px}.slip .lh h1{font-size:20px}
.slip-title{background:#1b2b5e;color:#fff;text-align:center;font-weight:700;letter-spacing:.14em;padding:8px;border-radius:4px;margin-bottom:16px}
.slip-info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #9aa3b8;margin-bottom:16px}.slip-info div{display:grid;grid-template-columns:130px 1fr;padding:6px 12px;border-bottom:1px solid #dde2ee}.slip-info div:nth-last-child(-n+2){border-bottom:0}.slip-info b{color:#444}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;border:1px solid #9aa3b8}.slip-cols>div+div{border-left:1px solid #9aa3b8}.slip-cols h4{margin:0;background:#eef1f8;padding:7px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #9aa3b8}
.slip-cols .r{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px dashed #dde2ee}.slip-cols .tot{font-weight:700;background:#f7f8fc;border-top:1px solid #9aa3b8;border-bottom:0}
.net{display:flex;justify-content:space-between;align-items:center;border:2px solid #1b2b5e;margin-top:16px;padding:12px 16px;font-size:16px;font-weight:800;border-radius:4px}.net-words{margin-top:8px;font-style:italic;color:#333}
@media(max-width:900px){:root{--side-w:0px}.workspace-side{position:static;width:auto;padding:12px 16px}.workspace-brand{padding-bottom:12px}.workspace-side nav,.workspace-side nav>div{display:flex;flex-wrap:wrap;gap:4px}.workspace-side nav p{display:none}.workspace-side nav button{width:auto}.workspace-top,body>main{margin-left:0;padding-inline:16px}.dashboard-grid{grid-template-columns:1fr}.match{grid-template-columns:1fr 70px 1fr}.print-sheet{padding:28px 22px}.slip-info,.slip-cols,.signatures{grid-template-columns:1fr}.slip-cols>div+div{border-left:0;border-top:1px solid #9aa3b8}}
@media print{.print-controls{display:none!important}@page{size:A4;margin:0}html,body{background:#fff}.workspace-side,.workspace-top,body>main,.dialog-bar,#balaji-vault-overlay{display:none!important}dialog[open]{position:static;width:100%;max-width:none;max-height:none;overflow:visible;background:#fff;box-shadow:none;border-radius:0}dialog::backdrop{display:none}.dialog-body{padding:0;overflow:visible;max-height:none}.print-sheet{box-shadow:none;max-width:none;padding:20mm 20mm;min-height:297mm}.print-sheet,.signatures,.slip-cols,.clause{break-inside:avoid}.slip{padding:14mm}}

.print-copies{display:grid;grid-template-columns:1fr 1fr;gap:18px}.print-copies img{width:100%;height:135mm;object-fit:contain;object-position:top center}.print-copies h2{font:600 14px Inter,Arial,sans-serif;margin:0 0 8px}
</style>

<script>
"use strict";
const csrf = {{ csrf_token | tojson }};
const screen = document.querySelector("#screen");
const notice = document.querySelector("#notice");
const escape = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const e = escape;
let access, viewId = 0;
async function api(method, args = {}, write = false) {
  const query = new URLSearchParams(Object.entries(args).filter(([,value])=>value!=null));
  const response = await fetch("/api/method/balaji_hr.people." + method + (write ? "" : "?" + query), {
    method: write ? "POST" : "GET", headers: write ? {"Content-Type":"application/json","X-Frappe-CSRF-Token":csrf} : {},
    body: write ? JSON.stringify(args) : undefined, cache:"no-store"
  });
  if (response.status === 401) throw Error("Your session expired. Sign in again.");
  if (!response.ok) throw Error("Request failed. Check your permissions and the required values, then try again.");

async function attendanceBulk(panel){
  const today=pageDate(new Date());
  panel.innerHTML='<div class="bar"><label>Date<input type="date" name="date" value="'+today+'" max="'+today+'"></label><label>Department<input name="department" list="att-dept" placeholder="All departments" autocomplete="off"><datalist id="att-dept"></datalist></label><label>Search<input name="q" placeholder="Employee name"></label><span class="spacer"></span><button type="button" data-all="Present">✓ Mark all Present</button><button type="button" data-all="">Clear</button></div><div class="chips"></div><div class="host" style="margin-top:14px"></div><div class="savebar" hidden><span></span><button type="button" class="primary" data-save>Save attendance</button></div>';
  const $=s=>panel.querySelector(s), host=$(".host"), chips=$(".chips"), bar=$(".savebar");
  const date=$('[name=date]'), dept=$('[name=department]'), q=$('[name=q]');

  function counts(){

    }));

    chips.innerHTML='<span class="chip p">Present '+c.Present+'</span><span class="chip a">Absent '+c.Absent+'</span><span class="chip h">Half day '+c["Half Day"]+'</span><span class="chip w">WFH '+c["Work From Home"]+'</span><span class="chip">Not marked '+c.Unmarked+'</span>';
    bar.hidden=!choice.size;
    bar.firstElementChild.textContent=choice.size+" employee"+(choice.size===1?"":"s")+" ready to save for "+date.value;
  }
  async function load(reset){
    const seq=++request;
    if(reset)choice.clear();
    host.textContent="Loading…";

      if(seq!==request||!host.isConnected)return;

      paint();return;

        setNotice("Saved "+result.created+" attendance record"+(result.created===1?"":"s")+(result.skipped?" · "+result.skipped+" already marked":"")+(failed?" · Failed: "+failed:""),!!failed);
        await load(true);

    }
  };

    left.innerHTML=shown().map(p=>{const s=pairs.get(p.name);return '<div class="m-item'+(selected.has(p.name)?' sel':'')+'" draggable="true" tabindex="0" role="button" data-emp="'+e(p.name)+'" aria-pressed="'+selected.has(p.name)+'"><span class="avatar">'+initials(p.employee_name)+'</span><div><b>'+e(p.employee_name)+'</b><small>'+e([p.name,p.department].filter(Boolean).join(" · "))+'</small></div>'+(s?'<span class="m-tag" style="background:'+color.get(s)+'">'+e(s)+' <i data-undo="'+e(p.name)+'" title="Remove">×</i></span>':'')+'</div>';}).join("")||'<p class="muted">No employees match your search.</p>';
    right.innerHTML=d.shifts.map(s=>{const n=[...pairs.values()].filter(v=>v===s.name).length;return '<div class="m-item shift-item" tabindex="0" role="button" data-shift="'+e(s.name)+'" style="border-left-color:'+color.get(s.name)+'"><div><b>'+e(s.name)+'</b><small>'+e(hm(s.start_time))+' – '+e(hm(s.end_time))+'</small></div><span class="m-count">'+n+'</span></div>';}).join("");
    bar.hidden=!pairs.size;
    bar.firstElementChild.textContent=pairs.size+" match"+(pairs.size===1?"":"es")+" ready to save";
    lines();
  }
  function lines(){
    if(!svg.isConnected)return;
    const lr=lane.getBoundingClientRect(), L=left.getBoundingClientRect(), R=right.getBoundingClientRect();
    const mid=el=>{const r=el.getBoundingClientRect();return r.top+r.height/2;};
    let out="";
    for(const [emp,shift] of pairs){
      const a=left.querySelector('[data-emp="'+CSS.escape(emp)+'"]'), b=right.querySelector('[data-shift="'+CSS.escape(shift)+'"]');
      if(!a||!b)continue;
      const ya=mid(a), yb=mid(b);
      if(ya<L.top||ya>L.bottom||yb<R.top||yb>R.bottom)continue;
      const y1=ya-lr.top, y2=yb-lr.top, w=lr.width;
      out+='<path d="M0,'+y1+' C'+w/2+','+y1+' '+w/2+','+y2+' '+w+','+y2+'" stroke="'+color.get(shift)+'" stroke-width="2.2" fill="none" opacity=".85"/><circle cx="0" cy="'+y1+'" r="3.5" fill="'+color.get(shift)+'"/><circle cx="'+w+'" cy="'+y2+'" r="3.5" fill="'+color.get(shift)+'"/>';
    }
    svg.innerHTML=out;
  }
  let raf=0;const redraw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(lines);};
  left.addEventListener("scroll",redraw);right.addEventListener("scroll",redraw);window.addEventListener("resize",redraw);
  function assign(emps,shift){emps.forEach(x=>pairs.set(x,shift));selected.clear();paint();}
  panel.addEventListener("click",event=>{
    const undo=event.target.closest("[data-undo]");
    if(undo){pairs.delete(undo.dataset.undo);paint();return;}
    const emp=event.target.closest("[data-emp]");
    if(emp&&left.contains(emp)){const id=emp.dataset.emp;selected.has(id)?selected.delete(id):selected.add(id);paint();return;}
    const shift=event.target.closest("[data-shift]");
    if(shift){if(!selected.size){setNotice("Select one or more employees on the left first.",true);return;}notice.textContent="";assign([...selected],shift.dataset.shift);return;}
    if(event.target.closest("[data-pick]")){shown().forEach(p=>selected.add(p.name));paint();}
    if(event.target.closest("[data-unpick]")){selected.clear();paint();}
    if(event.target.closest("[data-reset]")){pairs.clear();selected.clear();paint();}
  });
  panel.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&event.target.matches(".m-item")){event.preventDefault();event.target.click();}});
  left.addEventListener("dragstart",event=>{const el=event.target.closest("[data-emp]");if(!el)return;const id=el.dataset.emp;const ids=selected.has(id)?[...selected]:[id];event.dataTransfer.setData("text/plain",JSON.stringify(ids));event.dataTransfer.effectAllowed="move";});
  right.addEventListener("dragover",event=>{const el=event.target.closest("[data-shift]");if(!el)return;event.preventDefault();right.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));el.classList.add("drop");});
  right.addEventListener("dragleave",event=>{event.target.closest?.("[data-shift]")?.classList.remove("drop");});
  right.addEventListener("drop",event=>{const el=event.target.closest("[data-shift]");if(!el)return;event.preventDefault();try{assign(JSON.parse(event.dataTransfer.getData("text/plain")),el.dataset.shift);}catch(error){}});
  q.oninput=paint;
  bar.querySelector("[data-save]").onclick=async event=>{
    const btn=event.currentTarget, start=$("[name=start]").value;
    if(!start){setNotice("Choose a start date.",true);return;}
    btn.disabled=true;
    try{
      const result=await api("shift_match_save",{pairs:[...pairs].map(([employee,shift_type])=>({employee,shift_type})),start_date:start,end_date:$("[name=end]").value||null,submit:Number($("[name=submit]").checked)},true);
      const failed=new Set(result.errors.map(x=>x.employee));
      [...pairs.keys()].forEach(k=>{if(!failed.has(k))pairs.delete(k);});
      const detail=result.errors.map(x=>(people[x.employee]?.employee_name||x.employee)+": "+x.error.replace(/<[^>]*>/g,"")).join(" | ");
      setNotice("Created "+result.created+" shift assignment"+(result.created===1?"":"s")+(result.submitted?" (submitted)":" (draft)")+(detail?" · Failed: "+detail:""),!!detail);
      paint();
    }catch(error){showError(error);}finally{btn.disabled=false;}
  };
  paint();
}

async function operationForm(panel,dt,record){
  panel.textContent="Loading form…";
  const data=await api("operation_form",{doctype:dt,name:record});
  if(!panel.isConnected)return;
  let next=0;
  function control(f,val,index=""){
    const name=e(f.name+index), value=String(val??"");
    const attrs=' name="'+name+'" '+(f.required?'required ':'')+(data.can_write?'':'disabled ');
    let input;
    if(f.type==="Select"){
      input='<select'+attrs+'>'+[...new Set(["",...(f.options||"").split("\n"),value])].map(x=>'<option'+(x===value?' selected':'')+'>'+e(x)+'</option>').join("")+'</select>';
    }else if(f.type==="Check"){
      input='<input type="checkbox"'+attrs+(Number(val)?' checked':'')+'>';
    }else if(f.type==="Link"){
      input='<input'+attrs+' value="'+e(value)+'" data-link="'+e(f.options)+'" list="choices-'+name+'" autocomplete="off"><datalist id="choices-'+name+'"></datalist>';
    }else{
      const type={Date:"date",Datetime:"datetime-local",Time:"time"}[f.type]||"text";
      input='<input type="'+type+'"'+attrs+' value="'+e(type==="datetime-local"?value.replace(" ","T").slice(0,19):value)+'"'+(type==="datetime-local"?' step="1"':'')+'>';
    }
    return '<label>'+e(f.label)+input+'</label>';
  }
  const holiday=(row={})=>{
    const suffix="_"+(++next);
    return '<div class="fields holiday-row" data-suffix="'+suffix+'">'+data.child_schema.map(f=>control(f,row[f.name],suffix)).join("")+(data.can_write?'<button type="button" data-remove>Remove date</button>':'')+'</div>';
  };
  panel.innerHTML='<div class="bar"><button type="button" id="operation-back">Back to records</button></div><h2>'+e(record||"New record")+'</h2><form><div class="fields">'+data.schema.map(f=>control(f,data.values[f.name])).join("")+'</div>'+
    (data.child_schema.length?'<fieldset><legend>Holiday dates</legend><div id="holiday-rows">'+data.holidays.map(holiday).join("")+'</div>'+(data.can_write?'<button type="button" data-add-date>Add date</button>':'')+'</fieldset>':'')+
    (data.can_write?'<div class="bar"><button class="primary" value="save">Save</button>'+(data.can_submit?'<button value="submit">Submit record</button>':'')+'</div>':'')+'</form>';
  panel.querySelector("#operation-back").onclick=()=>view("operation",dt);
  const form=panel.querySelector("form");
  addFieldNavigation(form);
  form.onclick=event=>{
    if(event.target.closest("[data-add-date]"))form.querySelector("#holiday-rows").insertAdjacentHTML("beforeend",holiday());
    if(event.target.closest("[data-remove]"))event.target.closest(".holiday-row").remove();
  };
  let timer, linkRequest=0;
  function suggest(event){
    const input=event.target.closest("[data-link]");
    if(!input)return;
    const seq=++linkRequest;
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      try{
        const options=await api("link_options",{doctype:input.dataset.link,search:input.value});
        if(input.isConnected&&seq===linkRequest)input.list.innerHTML=options.map(v=>'<option value="'+e(v)+'"></option>').join("");
      }catch(error){if(input.isConnected&&seq===linkRequest)showError(error);}
    },200);
  }
  form.addEventListener("input",suggest);
  form.addEventListener("focusin",suggest);
  function values(schema,suffix=""){
    return Object.fromEntries(schema.map(f=>{
      const input=form.elements.namedItem(f.name+suffix);
      let value=input.type==="checkbox"?Number(input.checked):input.value;
      if(input.type==="datetime-local"&&value)value=value.replace("T"," ");
      return [f.name,value];
    }));
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!data.can_write)return;
    const button=event.submitter;
    const submit=button?.value==="submit";
    if(submit&&!window.confirm("Submit this record?"))return;
    const payload={doctype:dt,name:record,values:values(data.schema),submit:Number(submit)};
    if(data.child_schema.length)payload.holidays=Array.from(form.querySelectorAll(".holiday-row"),row=>values(data.child_schema,row.dataset.suffix));
    form.querySelectorAll('button:not([type]),button[type="submit"]').forEach(b=>b.disabled=true);
    try{
      const saved=await api("operation_save",payload,true);
      if(form.isConnected)openOperation(dt,saved);
    }catch(error){
      if(form.isConnected){showError(error);form.querySelectorAll('button:not([type]),button[type="submit"]').forEach(b=>b.disabled=false);}
    }
  };
}

function addFieldNavigation(form){
  const bar=document.createElement("div");
  bar.className="bar";
  bar.innerHTML='<button type="button">Previous field</button><button type="button">Next field</button><span class="muted">Tab / Shift+Tab</span>';
  form.prepend(bar);
  let last=null;
  const selector="input:not([type=hidden]):enabled,select:enabled,textarea:enabled";
  form.addEventListener("focusin",event=>{if(event.target.matches(selector))last=event.target;});
  [...bar.querySelectorAll("button")].forEach((button,index)=>button.onclick=()=>{
    const fields=[...form.querySelectorAll(selector)].filter(input=>input.getClientRects().length);
    if(!fields.length)return;
    const current=fields.indexOf(last);
    const target=current<0?(index===0?fields.length-1:0):Math.max(0,Math.min(fields.length-1,current+(index===0?-1:1)));
    fields[target].focus();
  });
}
function employeeDocuments(p, employee, form) {
  const panel=document.createElement("section");
  panel.className="employee-documents";
  const titles=["Employee details","Passport & permit","Joining letter","Experience letter","Resignation letter"];
  const inp=(name,value="",ph="")=>'<input type="text" name="'+e(name)+'" value="'+e(value)+'" placeholder="'+e(ph)+'">';
  const salaryDefault=p.private?.salary||"";
  panel.innerHTML='<h2>Employee documents</h2><p class="muted" style="margin-bottom:14px">Preview and print professional letters for this employee.</p><div class="bar">'+titles.map((t,i)=>'<button type="button" data-print="'+i+'" '+((i===1&&!p.can_view_private)||(i===4&&!p.resignation.letter_date)?"disabled":"")+'>'+e(t)+'</button>').join("")+'</div>'+
    '<details><summary>Letter details (joining letter &amp; others)</summary><div class="fields"><label>Letter date<input type="date" name="letter_date_print" value="'+pageDate(new Date())+'"></label><label>Basic monthly salary (RM)<input name="agreement_salary" type="number" min="0.01" step="0.01" value="'+e(salaryDefault)+'"></label><label>Working hours'+inp("agreement_hours","","e.g. 8.00 am – 5.00 pm, Monday to Saturday")+'</label><label>Place of work'+inp("agreement_location","","e.g. Kajang, Selangor")+'</label><label>Food arrangement (optional)'+inp("agreement_food","","e.g. Free meals provided")+'</label><label>Notice period'+inp("agreement_notice","","e.g. one (1) month")+'</label><label>Probation (optional)'+inp("agreement_probation","","e.g. three (3) months")+'</label></div></details>'+
    '<details><summary>Resignation</summary><div class="fields"><label><span>Record resignation</span><input type="checkbox" name="record_resignation" '+(p.resignation.letter_date?"checked ":"")+(!p.can_record_resignation?"disabled":"")+'></label><label>Resignation letter date<input type="date" name="letter_date" value="'+e(p.resignation.letter_date)+'"></label><label>Last working day<input type="date" name="last_day" value="'+e(p.resignation.last_day)+'"></label></div>'+(p.can_record_resignation?'<div class="bar" style="margin-top:14px"><button type="button" class="primary" data-save-resignation>Save resignation</button></div>':'')+'</details>';
  form.after(panel);
  const get=name=>panel.querySelector('[name="'+name+'"]');
  const v=p.values, c=p.private||{}, info=p.company_info||{}, name=p.full_name||v.first_name||employee;
  const company=info.company_name||v.company||"Balaji Enterprise Sdn Bhd";
  const position=v.custom_balaji_position||v.designation||"";
  const g=(v.gender||"").toLowerCase();
  const P=g==="male"?{he:"he",He:"He",his:"his",him:"him"}:g==="female"?{he:"she",He:"She",his:"her",him:"her"}:{he:"they",He:"They",his:"their",him:"them"};
  const clause=(n,t)=>'<div class="clause"><span>'+n+'.</span><span>'+t+'</span></div>';
  const para=t=>'<p>'+t+'</p>';
  const sign=(a,b)=>'<div class="signatures">'+a+b+'</div>';
  const box=(lines)=>'<div class="signature">'+lines.map(x=>e(x)).join("<br>")+'</div>';
  const year=new Date().getFullYear();
  const ref=code=>'BE/HR/'+code+'/'+year+'/'+employee;
  const idLine=()=>"Employee ID "+employee+(p.can_view_private&&c.passport_number?", Passport No. "+c.passport_number:"");
  function copy(field,label){
    const url=p.attachments[field];
    if(!url?.startsWith("/private/files/"))return '<article><h2>'+e(label)+'</h2><p>Copy unavailable.</p></article>';
    if(!/\.(png|jpe?g|webp)(?:$|\?)/i.test(url))return '<article><h2>'+e(label)+'</h2><a href="'+e(url)+'" target="_blank" rel="noopener">Open original PDF for printing</a></article>';
    return '<article><h2>'+e(label)+'</h2><img src="'+e(url)+'" alt="'+e(label)+'"></article>';
  }
  function sheet(L,date,code,body,title,opts={}){
    const head=opts.plain?'':letterhead(company,L,info);
    return '<div class="print-sheet">'+head+'<div class="ref"><span>'+(opts.noref?'':'Ref: '+e(ref(code)))+'</span><span>Date: '+e(fmtDate(date))+'</span></div>'+body+'</div>';
  }
  function preview(index){
    const L=letterSettings(), date=get("letter_date_print").value||pageDate(new Date());
    const signer=L.signer||"Authorised Signatory", stitle=L.title||"";
    const companySign=box(["For and on behalf of",company.toUpperCase(),"","",signer,stitle].filter((x,i)=>i<4||x));
    let html="";
    if(index===0){
      const rows=[["Full name",name],["Employee ID",employee],["Position",position],["Department",v.department],["Date of joining",fmtDate(v.date_of_joining)],["Category",v.custom_balaji_category],...(p.can_view_private?[["Work permit no.",c.permit_number],["Work permit expiry",fmtDate(c.permit_expiry_date)],["Visa no.",c.visa_number],["Visa expiry",fmtDate(c.visa_expiry_date)],["Passport no.",c.passport_number],["Passport expiry",fmtDate(c.passport_expiry_date)]]:[])];
      html=sheet(L,date,"ED",'<div class="letter-title">Employee Details</div><table class="terms">'+rows.map(([k,x])=>'<tr><td>'+e(k)+'</td><td>'+e(x||"—")+'</td></tr>').join("")+'</table>',"");
    }else if(index===1){
      html='<div class="print-sheet"><div class="letter-title">Passport &amp; Work Permit</div><div class="print-copies">'+copy("passport_copy","Passport")+copy("permit_copy","Work permit")+'</div>';
      if(p.attachments.passport_copy&&p.attachments.permit_copy)html+='<p class="print-controls"><a href="/api/method/balaji_hr.people.print_document_copies?'+new URLSearchParams({employee})+'" target="_blank" rel="noopener">Open combined PDF for front/back printing</a></p>';
      html+='</div>';
    }else if(index===2){
      const salary=Number(get("agreement_salary").value);
      if(!(salary>0)||["agreement_hours","agreement_location","agreement_notice"].some(k=>!get(k).value.trim())){
        panel.querySelector("details").open=true;
        throw Error("Fill in salary, working hours, place of work and notice period before printing the joining letter.");
      }
      const hours=get("agreement_hours").value.trim(), place=get("agreement_location").value.trim(), notice=get("agreement_notice").value.trim(), food=get("agreement_food").value.trim(), prob=get("agreement_probation").value.trim();
      const money="RM "+salary.toLocaleString("en-MY",{minimumFractionDigits:2});
      const terms=[["Position",position],["Commencement date",fmtDate(v.date_of_joining)],["Basic monthly salary",money],["Working hours",hours],["Place of work",place],...(food?[["Food arrangement",food]]:[]),...(prob?[["Probation period",prob]]:[]),["Notice period",notice]];
      let n=0;
      html=sheet(L,date,"JL",
        '<div class="to"><b>'+e(name)+'</b><br>'+e(idLine())+'</div><div class="letter-title">Letter of Appointment</div><p class="subject">Appointment as '+e(position||"Employee")+'</p>'+para('Dear '+e(name)+',')+
        para('We are pleased to confirm your appointment as <b>'+e(position||"Employee")+'</b>'+(v.department?' in the '+e(v.department)+' department':'')+' of <b>'+e(company)+'</b> with effect from <b>'+e(fmtDate(v.date_of_joining))+'</b>. The principal terms of your employment are set out below.')+
        '<table class="terms">'+terms.map(([k,x])=>'<tr><td>'+e(k)+'</td><td>'+e(x)+'</td></tr>').join("")+'</table>'+
        clause(++n,'<b>Remuneration.</b> Your basic salary will be '+e(money)+' per month, payable monthly. Statutory contributions and deductions, including EPF, SOCSO and EIS where applicable, will be made in accordance with Malaysian law.')+
        clause(++n,'<b>Hours and place of work.</b> Your working hours are '+e(hours)+'. You will be based at '+e(place)+' and may be assigned to other locations of the company as business needs require.')+
        (food?clause(++n,'<b>Food.</b> '+e(food)+'.'):'')+
        (prob?clause(++n,'<b>Probation.</b> Your employment is subject to a probation period of '+e(prob)+', after which your performance will be reviewed.'):'')+
        clause(++n,'<b>Conduct.</b> You are expected to perform your duties diligently and honestly, and to comply with the company\'s rules, policies and lawful instructions.')+
        clause(++n,'<b>Confidentiality.</b> You shall keep all confidential information of the company private, both during and after your employment.')+
        (v.custom_balaji_category==="Foreign"?clause(++n,'<b>Right to work.</b> This appointment is conditional upon you holding a valid work permit and all documents required to work in Malaysia.'):'')+
        clause(++n,'<b>Termination.</b> Either party may end this employment by giving '+e(notice)+' written notice, or payment in lieu of notice, subject to applicable law.')+
        para('Please sign the duplicate copy of this letter to confirm that you have read, understood and accepted these terms. We welcome you to '+e(company)+' and wish you a successful career with us.')+para('Yours sincerely,')+
        sign(companySign,box(["Accepted and agreed by:",name,"Date:"].concat([]))),"");
    }else if(index===3){
      const last=p.resignation.last_day;
      html=sheet(L,date,"EL",
        '<div class="letter-title">Experience Certificate</div><p class="subject" style="text-align:center">TO WHOM IT MAY CONCERN</p>'+
        para('This is to certify that <b>'+e(name)+'</b> ('+e(idLine())+') '+(last?'was employed':'has been employed')+' with <b>'+e(company)+'</b> as <b>'+e(position||"Employee")+'</b>'+(v.department?' in the '+e(v.department)+' department':'')+' from <b>'+e(fmtDate(v.date_of_joining))+'</b> '+(last?'to <b>'+e(fmtDate(last))+'</b>.':'to date.'))+
        (p.resignation.letter_date?para(P.He+' resigned from the position by letter dated '+e(fmtDate(p.resignation.letter_date))+', and was relieved of duties with effect from '+e(fmtDate(last))+'.'):'')+
        para('During '+P.his+' employment with us, '+P.he+' carried out '+P.his+' duties sincerely and diligently. '+P.his.charAt(0).toUpperCase()+P.his.slice(1)+' conduct and performance were found to be satisfactory.')+
        para('We thank '+P.him+' for '+P.his+' services and wish '+P.him+' every success in the future.')+para('Yours faithfully,')+
        sign(companySign,'<div></div>'),"");
    }else if(index===4){
      const last=p.resignation.last_day, notice=get("agreement_notice").value.trim();
      html=sheet(L,p.resignation.letter_date,"RL",
        '<div class="to" style="text-align:left"><b>'+e(name)+'</b><br>'+e(idLine())+'<br>'+e(position)+'</div><div class="to">The Human Resources Manager<br><b>'+e(company)+'</b></div><p class="subject">RESIGNATION FROM THE POST OF '+e((position||"EMPLOYEE").toUpperCase())+'</p>'+para('Dear Sir / Madam,')+
        para('I am writing to formally tender my resignation from the position of <b>'+e(position||"Employee")+'</b> at <b>'+e(company)+'</b>. My last working day will be <b>'+e(fmtDate(last))+'</b>'+(notice?', in accordance with the notice period of '+e(notice):'')+'.')+
        para('During my notice period, I will complete my pending work and assist with the handover of my responsibilities so that the transition is smooth.')+
        para('I sincerely thank the company and my colleagues for the opportunity, guidance and support I have received during my employment, and I wish the company continued success.')+para('Yours faithfully,')+
        sign(box([name,employee,"Date: "+fmtDate(p.resignation.letter_date)]),'<div></div>'),"",{plain:true});
    }else return;
    openPrint(html,titles[index]+" · "+name);
  }
  panel.onclick=async event=>{
    const print=event.target.closest("[data-print]");
    const save=event.target.closest("[data-save-resignation]");
    try{
      if(print)preview(Number(print.dataset.print));
      if(save){
        if(!get("record_resignation").checked||!get("letter_date").value||!get("last_day").value)
          throw Error("Tick Record resignation and enter the letter date and last working day.");
        save.disabled=true;
        const dates=await api("save_resignation",{employee,letter_date:get("letter_date").value,last_day:get("last_day").value},true);
        p.resignation=dates;
        panel.querySelector('[data-print="4"]').disabled=false;
        setNotice("Resignation dates saved.");
      }
    }catch(error){showError(error);}
    finally{if(save)save.disabled=false;}
  };
}

const printDialog=document.querySelector("#print-dialog");
document.querySelector("#print-close").onclick=()=>printDialog.close();
document.querySelector("#print-now").onclick=async()=>{
  await Promise.all(Array.from(printDialog.querySelectorAll("img"),image=>image.decode().catch(()=>{})));
  window.print();
};
document.addEventListener("keydown",event=>{
  if(event.defaultPrevented||event.repeat||event.isComposing||event.altKey||event.ctrlKey||event.metaKey)return;
  const typing=event.target.closest?.("input,textarea,select,[contenteditable]");
  if(event.key==="Escape"||(event.key.toLowerCase()==="o"&&!typing)){
    event.preventDefault();
    if(printDialog.open)printDialog.close();
    view("overview");
  }
});
view("overview");
