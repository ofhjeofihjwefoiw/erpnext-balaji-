/* Align workspace content and keep wide registers inside their own scroll area. */
@media screen {
  :root {
    --workspace-sidebar: 208px;
    --workspace-gutter: clamp(16px, 3vw, 40px);
    --workspace-gap: 16px;
    --control-height: 42px;
  }

  .workspace-side { width: var(--workspace-sidebar); }
  .workspace-top,
  body > main {
    margin-left: var(--workspace-sidebar);
    padding-inline: var(--workspace-gutter);
  }
  .workspace-top { gap: 8px 20px; }
  .workspace-top > span { overflow-wrap: anywhere; }
  #workspace-user { margin-left: auto; text-align: right; }
  #notice:empty { display: none; }
  #screen, section, fieldset, .dashboard-grid > *, .fields > * { min-width: 0; }
  #screen h1, #screen h2, .feed li, .tool { overflow-wrap: anywhere; }

  .hero { flex-wrap: wrap; margin-bottom: 20px; }
  .hero p, #screen > h1 + p { margin: 6px 0 0; }
  #screen > h1 + button { margin-top: 8px; }
  .hero > button { flex: none; }

  .cards {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr));
    gap: var(--workspace-gap);
    border: 0;
    border-radius: 0;
    overflow: visible;
  }
  .card {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    justify-content: space-between;
  }
  .card strong { font-size: clamp(22px, 2.5vw, 32px); overflow-wrap: anywhere; }
  .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tools { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .tool { display: grid; align-content: start; }

  .bar { gap: 10px 12px; align-items: flex-end; }
  .bar > label { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .bar button, .bar input:not([type="checkbox"]), .bar select,
  .fields input:not([type="checkbox"]), .fields select, .fields textarea,
  .holiday-row > button {
    min-height: var(--control-height);
    font: inherit;
    line-height: 1.25;
  }
  .bar [data-week] { min-width: var(--control-height); padding-inline: 8px; }
  .fields {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
    gap: var(--workspace-gap);
    align-items: end;
  }
  .fields label { min-width: 0; overflow-wrap: anywhere; }
  .fields input:not([type="checkbox"]), .fields select, .fields textarea { width: 100%; }
  .fields input[type="checkbox"] { margin: 0 0 13px; width: 16px; height: 16px; }
  .results .bar:first-child { margin-top: 0; }
  .results > .bar:last-child, section > .bar:last-child { margin-bottom: 0; }
  #screen > button + .results { margin-top: 12px; }
  #payroll-results > .bar + .cards { margin-top: 0; }

  .table { max-width: 100%; }
  th, td { vertical-align: middle; }
  .table td button, .table td a {
    display: inline-block;
    max-width: 30ch;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: inherit;
  }
  .calendar th:not(:first-child), .calendar td:not(:first-child),
  .roster th:nth-child(n+4), .roster td:nth-child(n+4) { text-align: center; }
  .calendar th:first-child, .calendar td:first-child,
  .roster th:first-child, .roster td:first-child {
    min-width: 150px;
    max-width: 220px;
    white-space: normal;
    overflow-wrap: anywhere;
    z-index: 1;
    box-shadow: 1px 0 var(--line);
  }
  .calendar th:first-child, .roster th:first-child { background: #f2efe7; }
  .roster .shift-tag { margin-block: 2px; }
  [data-view-name="payroll"] #payroll-results section:last-child :is(th, td):nth-child(n+3):nth-child(-n+5) {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 800px) {
    :root { --workspace-sidebar: 0px; }
    .workspace-side { width: auto; padding: 12px var(--workspace-gutter); }
    .workspace-brand { padding: 0 0 10px; margin-bottom: 8px; }
    .workspace-side nav, .workspace-side nav > div { gap: 4px; }
    .workspace-side nav > div:not([hidden]) { display: flex; flex-wrap: wrap; }
    .workspace-side nav > div[hidden] { display: none !important; }
    .dashboard-grid { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 480px) {
    .workspace-top { align-items: flex-start; flex-direction: column; }
    #workspace-user { margin-left: 0; text-align: left; }
    #screen :is(section, fieldset) { padding: 14px; }
    #screen .dashboard-grid section { padding: 0; }
    .bar input, .bar select { max-width: 100%; }
    dialog { padding: 12px; }
    .print-sheet { padding: 12px; }
    .print-copies, .signatures, .print-sheet dl > div { grid-template-columns: minmax(0, 1fr); }
  }
}
</style>
<aside class="workspace-side"><div class="workspace-brand"><span>BE</span><strong>Balaji Enterprises<small>People workspace</small></strong></div><nav aria-label="Main navigation"><p>Workspace</p><button data-view="overview">⌂ &nbsp; Dashboard</button><button data-view="employees">♙ &nbsp; Employees</button><p>Attendance &amp; leave</p><div id="operation-nav"></div><div id="payroll-nav" hidden><p>Payroll</p><button data-view="payroll">▤ &nbsp; Payroll register</button></div><p>Reports &amp; settings</p><button data-view="reports" hidden>▤ &nbsp; Expiry reports</button><a id="company-settings" hidden>⚙ &nbsp; Company settings</a></nav></aside>
<header class="workspace-top"><span id="workspace-path">Workspace · Dashboard</span><span id="workspace-user"></span></header>
<main><button id="overview-back" type="button" data-view="overview" hidden>← Overview <kbd>O / Esc</kbd></button><p id="notice" role="status"></p><div id="screen"></div></main>
<dialog id="print-dialog" aria-label="Employee document preview"><div class="bar print-controls"><button type="button" id="print-close">Close preview</button><button type="button" class="primary" id="print-now">Print / Save PDF</button></div><div class="print-sheet"></div></dialog>
<script>
"use strict";
const csrf = {{ csrf_token | tojson }};
const screen = document.querySelector("#screen");
const notice = document.querySelector("#notice");
const escape = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const e = escape;
let access, viewId = 0;
async function api(method, args = {}, write = false) {
  const query = new URLSearchParams(Object.entries(args).filter(([,value])=>value!=null));
  const response = await fetch("/api/method/balaji_hr.people." + method + (write ? "" : "?" + query), {
    method: write ? "POST" : "GET", headers: write ? {"Content-Type":"application/json","X-Frappe-CSRF-Token":csrf} : {},
    body: write ? JSON.stringify(args) : undefined, cache:"no-store"
  });
  if (response.status === 401) throw Error("Your session expired. Sign in again.");
  if (!response.ok) throw Error("Request failed. Check your permissions and the required values, then try again.");
  return (await response.json()).message;
}
const table = (headers, rows) => rows.length ? '<div class="table"><table><thead><tr>' + headers.map(h=>'<th scope="col">'+e(h)+'</th>').join('') + '</tr></thead><tbody>' + rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>' : '<p class="muted">No records found.</p>';
function showError(error){notice.className="error";notice.textContent=error.message;}
function view(name, employee) {
  const id = ++viewId;
  screen.dataset.viewName = name;
  document.querySelector("#overview-back").hidden=name==="overview";
  notice.textContent="";
  document.querySelector("#workspace-path").textContent="Workspace · "+({overview:"Dashboard",employees:"Employees",profile:"Employee profile",reports:"Expiry reports",payroll:"Payroll",operation:operationLabels[employee]}[name]||"");
  screen.innerHTML="<p>Loading…</p>";
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===name && (name!=="operation" || b.dataset.employee===employee))));
  const render = html => {if(id===viewId) screen.innerHTML=html; return id===viewId;};
  ({overview,employees,reports,profile,operation,payroll}[name])(render, employee).catch(error=>{if(id===viewId){render("");showError(error);}});
}
function addButton(){return access?.can_create ? '<button class="primary" data-view="profile">Add employee</button>' : '';}
async function overview(render){
  const data=await api("overview");
  const feed=(rows,fn,empty)=>'<ul class="feed">'+(rows.length?rows.map(row=>'<li>'+fn(row)+'</li>').join(""):'<li class="muted">'+e(empty)+'</li>')+'</ul>';
  const quick=(data.operations||[]).map(dt=>'<button class="tool" data-view="operation" data-employee="'+e(dt)+'"><strong>'+e(operationLabels[dt])+'</strong><span>'+e(operationDescriptions[dt])+'</span></button>').join("");
  const first=(data.user||"").split(" ")[0];
  if(!render('<div class="hero"><div><h1>Welcome back, '+e(first)+'</h1><p class="muted">'+e(data.date)+' · Your people workspace</p></div>'+(data.can_create?'<button class="primary" data-view="profile">＋ Add employee</button>':'')+'</div>'+
    '<div class="cards">'+data.cards.map(c=>'<article class="card"><span>'+e(c.label)+'</span><strong>'+e(c.value)+'</strong></article>').join("")+'</div>'+
    '<div class="dashboard-grid"><section><h2>Recent joiners</h2>'+feed(data.recent,r=>profileButton(r.name,r.employee_name)+'<small>'+e([r.designation,r.date_of_joining].filter(Boolean).join(" · "))+'</small>',"No recent joiners to show.")+'</section>'+
    '<section><h2>Pending leave requests</h2>'+feed(data.requests,r=>'<strong>'+e(r.employee_name)+'</strong><small>'+e(r.leave_type)+' · '+e(r.from_date)+' to '+e(r.to_date)+'</small>',"No open requests to show.")+'</section>'+
    (data.can_expiry?'<section><h2>Upcoming document expiries</h2>'+feed(data.upcoming,r=>profileButton(r.employee,r.name)+'<small>'+e(r.document)+' · '+e(r.expiry)+'</small>',"No document expiries in the next 30 days.")+'</section>':'')+
    '</div><h2 style="margin-top:24px">Quick actions</h2><div class="tools">'+quick+'</div>'))return;
  access=data;
  document.querySelector("#payroll-nav").hidden=!data.can_payroll;
  document.querySelector("nav [data-view=reports]").hidden=!data.can_expiry;
  document.querySelector("#workspace-user").textContent=data.user||"";
  document.querySelector("#operation-nav").innerHTML=(data.operations||[]).map(dt=>'<button data-view="operation" data-employee="'+e(dt)+'">'+e(operationLabels[dt])+'</button>').join("");
  const settings=document.querySelector("#company-settings");
  settings.hidden=!data.settings_company;
  if(data.settings_company)settings.href="/app/company/"+encodeURIComponent(data.settings_company);
}
function pagination(offset, count){return '<div class="bar"><button data-step="-25" '+(offset?'':'disabled')+'>Previous</button><button data-step="25" '+(count>25?'':'disabled')+'>Next</button></div>';}
async function employees(render){
  if(!render('<h1>Employees</h1><p class="muted">Search and open employee profiles.</p><form class="bar"><input name="search" aria-label="Employee name" placeholder="Search employee name"><select name="category" aria-label="Category"><option value="">All categories</option><option>Local</option><option>Foreign</option><option>Other</option></select><button>Search</button>'+addButton()+'</form><section class="results"></section>'))return;
  await results("employees", r=>['Employee','ID','Department','Designation','Category','Status'], r=>['<div class="employee-cell"><span class="avatar">'+e((r.employee_name||"").split(/\s+/).slice(0,2).map(w=>w[0]).join(""))+'</span><div>'+profileButton(r.name,r.employee_name)+'<small>'+e(r.name)+'</small></div></div>',...["name","department","designation","custom_balaji_category"].map(k=>e(r[k])),'<span class="badge">'+e(r.status)+'</span>']);
}
async function reports(render){
  if(!render('<h1>Expiry reports</h1><p class="muted">Review upcoming expiry dates by document type.</p><form class="bar"><select name="kind" aria-label="Document type"><option value="permit_expiry_date">Work permits</option><option value="passport_expiry_date">Passports</option><option value="visa_expiry_date">Visas</option></select><select name="days" aria-label="Time window"><option>30</option><option>60</option><option>90</option></select><button>Run report</button></form><section class="results"></section>'))return;
  await results("expiry",()=>["Employee","ID","Expires"],r=>[profileButton(r.employee,r.name),e(r.employee),e(r.expiry)]);
}
function profileButton(id,name){return '<button data-view="profile" data-employee="'+e(id)+'">'+e(name)+'</button>';}
async function results(method,headers,map){
  const form=screen.querySelector("form"), result=screen.querySelector(".results");
  let offset=0, request=0;
  async function load(){
    const seq=++request;
    result.textContent="Loading…";
    try{
      const payload=await api(method,{...Object.fromEntries(new FormData(form)),offset});
      const rows=Array.isArray(payload)?payload:payload.rows;
      const count=Array.isArray(payload)?rows.length:payload.has_more?26:rows.length;
      if(seq===request&&result.isConnected)result.innerHTML=table(headers(rows),rows.slice(0,25).map(map))+pagination(offset,count);
    }catch(error){if(seq===request&&result.isConnected){result.textContent="";showError(error);}}
  }
  form.addEventListener("submit",event=>{event.preventDefault();offset=0;load();});
  result.addEventListener("click",event=>{const b=event.target.closest("[data-step]");if(b){offset+=Number(b.dataset.step);load();}});
  await load();
}
async function profile(render,employee){
  const p=await api("profile",employee?{employee}:{});
  const groups=[["Employee details",p.schema.filter(f=>!f.private&&!f.name.startsWith("custom_balaji_leave")&&f.name!=="custom_balaji_auto_leave")],["Leave setup",p.schema.filter(f=>f.name.startsWith("custom_balaji_leave")||f.name==="custom_balaji_auto_leave")],["Confidential details",p.schema.filter(f=>f.private)]];

async function operation(render, dt, record, editing=false){
  const title=operationLabels[dt];

  const add=screen.querySelector("#new-operation");
  if(add)add.onclick=()=>openOperation(dt,null);
  const panel=screen.querySelector(".results");
  let offset=0, request=0;
  async function load(){
    const seq=++request;
    panel.textContent="Loading…";
    try{
      const rows=await api("operation_list",{doctype:dt,offset});
      if(!panel.isConnected||seq!==request)return;
      const columns=Object.keys(rows[0]||{}).filter(key=>!["name","docstatus"].includes(key)).slice(0,6);
      panel.innerHTML=table(["Record","State",...columns.map(k=>k.replaceAll("_"," "))],rows.slice(0,25).map(row=>[

        ...columns.map(k=>e(row[k]))
      ]))+pagination(offset,rows.length);
    }catch(error){if(panel.isConnected&&seq===request){panel.textContent="";showError(error);}}
  }

    if(record)openOperation(dt,record.dataset.operationRecord);

    if(step){offset+=Number(step.dataset.step);load();}
  };
  if(editing)await operationForm(panel,dt,record);
  else if(dt==="Attendance"||dt==="Shift Assignment"){
    const showGrid=dt==="Attendance"?attendanceCalendar:shiftRoster;
    const gridLabel=dt==="Attendance"?"Monthly view":"Weekly roster";
    const toggle=document.createElement("button");
    toggle.type="button";

    toggle.onclick=()=>{

      if(calendar){++request;panel.onclick=null;showGrid(panel);}
      else{panel.onclick=null;offset=0;load();panel.onclick=listClick;}
    };

    panel.onclick=null;
    await showGrid(panel);
  }else await load();
}

function addFieldNavigation(form){
  const bar=document.createElement("div");
  bar.className="bar";
  bar.innerHTML='<button type="button">Previous field</button><button type="button">Next field</button><span class="muted">Tab / Shift+Tab</span>';
  form.prepend(bar);
  let last=null;
  const selector="input:not([type=hidden]):enabled,select:enabled,textarea:enabled";
  form.addEventListener("focusin",event=>{if(event.target.matches(selector))last=event.target;});
  [...bar.querySelectorAll("button")].forEach((button,index)=>button.onclick=()=>{
    const fields=[...form.querySelectorAll(selector)].filter(input=>input.getClientRects().length);
    if(!fields.length)return;
    const current=fields.indexOf(last);
    const target=current<0?(index===0?fields.length-1:0):Math.max(0,Math.min(fields.length-1,current+(index===0?-1:1)));
    fields[target].focus();
  });
}

  const paragraph=value=>'<p>'+e(value)+'</p>';
  const signature=label=>'<div class="signature">'+e(label)+'</div>';
  const company=v.company||"Balaji Enterprises";
  function copy(field,label){
    const url=p.attachments[field];
    if(!url?.startsWith("/private/files/"))return '<article><h2>'+e(label)+'</h2><p>Copy unavailable.</p></article>';
    if(!/\.(png|jpe?g|webp)(?:$|\?)/i.test(url))return '<article><h2>'+e(label)+'</h2><a href="'+e(url)+'" target="_blank" rel="noopener">Open original PDF for printing</a></article>';
    return '<article><h2>'+e(label)+'</h2><img src="'+e(url)+'" alt="'+e(label)+'"></article>';
  }
  function preview(index){
    let content="";
    if(index===0){
      content=lines([["Employee",name],["Employee ID",employee],["Position",position],["Department",v.department],["Joining date",v.date_of_joining],...(p.can_view_private?[
        ["Work permit number",c.permit_number],["Work permit expiry",c.permit_expiry_date],["Visa number",c.visa_number],["Visa expiry",c.visa_expiry_date],["Passport number",c.passport_number],["Passport expiry",c.passport_expiry_date]
      ]:[])]);
    }else if(index===1){
      content='<div class="print-copies">'+copy("passport_copy","Passport")+copy("permit_copy","Work permit")+'</div>';
      if(p.attachments.passport_copy&&p.attachments.permit_copy){
        const url="/api/method/balaji_hr.people.print_document_copies?"+new URLSearchParams({employee});
        content+='<p class="print-controls"><a href="'+e(url)+'" target="_blank" rel="noopener">Open combined PDF for front/back printing</a></p>';
      }
    }else if(index===2){
      const salary=Number(get("agreement_salary").value);
      const terms=["agreement_food","agreement_location","agreement_hours","agreement_notice"];
      if(!(salary>0)||terms.some(key=>!get(key).value.trim())){
        panel.querySelector("details").open=true;
        throw Error("Fill in salary, food arrangement, work location, working hours and notice period before printing.");
      }
      content=paragraph("This joining agreement records the employment terms agreed between "+company+" and "+name+".")+
        lines([["Employee",name],["Position",position],["Joining date",v.date_of_joining],["Basic monthly salary","RM "+salary.toFixed(2)],["Food arrangement",get("agreement_food").value],["Work location",get("agreement_location").value],["Working hours",get("agreement_hours").value],["Notice period",get("agreement_notice").value]])+
        paragraph("Either party may end the employment by giving the notice stated above, subject to applicable law.")+
        '<div class="signatures">'+signature("Employer representative")+signature("Employee")+'</div>';
    }else if(index===3){
      content=paragraph("This is to certify that "+name+" joined "+company+(v.date_of_joining?" on "+v.date_of_joining:"")+(position?" as "+position:"")+".")+
        lines([["Employee ID",employee],["Department",v.department],["Last working day",p.resignation.last_day]])+signature("Authorized signatory");
    }else if(index===4&&p.resignation.letter_date){
      content=lines([["Letter date",p.resignation.letter_date],["Employee",name],["Position",position],["Last working day",p.resignation.last_day]])+
        paragraph("Dear HR Manager,")+paragraph("I am submitting my resignation from "+company+". My last working day is stated above.")+paragraph("Thank you for the opportunity to work with the company.")+signature("Employee signature");
    }else return;
    const dialog=document.querySelector("#print-dialog");
    dialog.querySelector(".print-sheet").innerHTML='<header><strong>'+e(company)+'</strong><span>Human Resources</span></header><h1>'+e(titles[index])+'</h1><p class="print-subtitle">'+e(name)+'</p>'+content;
    dialog.showModal();
  }
  panel.onclick=async event=>{
    const print=event.target.closest("[data-print]");
    const save=event.target.closest("[data-save-resignation]");
    try{
      if(print)preview(Number(print.dataset.print));
      if(save){
        if(!get("record_resignation").checked||!get("letter_date").value||!get("last_day").value)
          throw Error("Tick Record resignation and enter the letter date and last working day.");
        save.disabled=true;
        const dates=await api("save_resignation",{employee,letter_date:get("letter_date").value,last_day:get("last_day").value},true);
        p.resignation=dates;
        panel.querySelector('[data-print="4"]').disabled=false;
        notice.className="";notice.textContent="Resignation dates saved.";
      }
    }catch(error){showError(error);}
    finally{if(save)save.disabled=false;}
  };
}

const printDialog=document.querySelector("#print-dialog");
document.querySelector("#print-close").onclick=()=>printDialog.close();
document.querySelector("#print-now").onclick=async()=>{
  await Promise.all(Array.from(printDialog.querySelectorAll("img"),image=>image.decode().catch(()=>{})));
  window.print();
};
document.addEventListener("keydown",event=>{
  if(event.defaultPrevented||event.repeat||event.isComposing||event.altKey||event.ctrlKey||event.metaKey)return;
  const typing=event.target.closest?.("input,textarea,select,[contenteditable]");
  if(event.key==="Escape"||(event.key.toLowerCase()==="o"&&!typing)){
    event.preventDefault();
    if(printDialog.open)printDialog.close();
    view("overview");
  }
});
view("overview");
</script>
